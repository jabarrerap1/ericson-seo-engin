[build]
  functions = "netlify/functions"
  command = "npm install"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  # Dispara la generación semanal de artículos (reemplaza al workflow externo
# de n8n que corría en Railway). Lunes 8:00am hora Ciudad de México
# (14:00 UTC, México no observa horario de verano).
[functions."weekly-article-trigger"]
  schedule = "35 2 * * *"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200

[[redirects]]
  from = "/"
  to = "/blog"
  status = 302

[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/blog-index"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/.netlify/functions/blog-post"
  status = 200
